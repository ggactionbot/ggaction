name: ggaction PNG report

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run report -- --output artifacts/ggaction-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ggaction-report-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            artifacts/ggaction-report/base.png
            artifacts/ggaction-report/revised.png
            artifacts/ggaction-report/report.json
          if-no-files-found: error
          retention-days: 7
